<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}} · Muse Grammar Notes</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.17"></script>
  <style>
    @supports (corner-shape: superellipse(1.25)) {
      :where(*), :where(*)::before, :where(*)::after {
        corner-shape: superellipse(1.25);
      }
    }

    :root {
      --bg: #ffffff;
      --surface: #f5f5f5;
      --ink: #0b0b0b;
      --ink-soft: rgba(0, 0, 0, 0.58);
      --ink-faint: rgba(0, 0, 0, 0.38);
      --on-ink: #ffffff;
      --line: rgba(0, 0, 0, 0.09);
      --line-strong: rgba(0, 0, 0, 0.15);
      --quiet-hover: rgba(0, 0, 0, 0.05);
      --quiet-down: inset 0 1px 2px rgba(0, 0, 0, 0.12);
      --quiet-down-bg: rgba(0, 0, 0, 0.08);

      /* Physical Keycap Tokens */
      --key-bg: #f3f3f4;
      --key-bg-hover: #f8f8f9;
      --key-bg-down: #ededee;
      --key-sheen: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(255,255,255,0));
      --key-rim: rgba(0, 0, 0, 0.1);
      --key-rim-low: rgba(0, 0, 0, 0.17);
      --key-lift: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(0,0,0,0.03), 0 1px 2px rgba(0,0,0,0.06), 0 2px 5px -2px rgba(0,0,0,0.12);
      --key-down: inset 0 1px 2px rgba(0,0,0,0.12), 0 1px 0 rgba(255,255,255,0.9);

      /* Obsidian Keycap */
      --ink-key-bg: #19191b;
      --ink-key-sheen: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0) 45%, rgba(255,255,255,0.05));
      --ink-key-rim: #08080a;
      --ink-key-text: #ffffff;
      --ink-key-lift: inset 0 1px 0 rgba(255,255,255,0.26), inset 0 -3px 3px -1.5px rgba(255,255,255,0.2), 0 1px 2px rgba(0,0,0,0.2), 0 3px 8px -2px rgba(0,0,0,0.26);

      /* Restrained Editorial Semantic Accents */
      --why-accent: #2563eb;
      --trap-accent: #dc2626;
      --formula-accent: #7c3aed;
      --errata-accent: #737373;
      --cloze-bg: #fef08a;
      --cloze-ink: #713f12;

      /* Lined Paper Mnemonic */
      --paper: #fffdf7;
      --paper-rule: rgba(64, 112, 178, 0.13);
      --paper-margin: rgba(222, 84, 72, 0.3);
      --paper-tape: rgba(236, 220, 172, 0.8);
      --paper-curl: rgba(0, 0, 0, 0.16);

      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: linear(0, 0.32, 0.78, 1.04, 1.09, 1.06, 1.02, 1, 0.99, 0.99, 1);
      --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-mono: "SF Mono", ui-monospace, Menlo, monospace;
      color-scheme: light;
    }

    :root[data-theme="dark"] {
      --bg: #0b0b0b;
      --surface: #151515;
      --ink: #f2f2f2;
      --ink-soft: rgba(255, 255, 255, 0.62);
      --ink-faint: rgba(255, 255, 255, 0.42);
      --on-ink: #0b0b0b;
      --line: rgba(255, 255, 255, 0.1);
      --line-strong: rgba(255, 255, 255, 0.16);
      --quiet-hover: rgba(255, 255, 255, 0.08);
      --quiet-down: inset 0 1px 2px rgba(0, 0, 0, 0.55);
      --quiet-down-bg: rgba(0, 0, 0, 0.35);

      --key-bg: #262627;
      --key-bg-hover: #2d2d2e;
      --key-bg-down: #212122;
      --key-sheen: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0));
      --key-rim: rgba(0, 0, 0, 0.6);
      --key-rim-low: rgba(0, 0, 0, 0.85);
      --key-lift: inset 0 1px 0 rgba(255,255,255,0.08), 0 1px 2px rgba(0,0,0,0.45), 0 2px 5px -2px rgba(0,0,0,0.55);
      --key-down: inset 0 1px 2px rgba(0,0,0,0.5);

      --ink-key-bg: #dededf;
      --ink-key-sheen: linear-gradient(180deg, rgba(255,255,255,0.65), rgba(255,255,255,0) 45%, rgba(255,255,255,0.3));
      --ink-key-rim: rgba(0, 0, 0, 0.75);
      --ink-key-text: #0b0b0b;
      --ink-key-lift: inset 0 1px 0 rgba(255,255,255,0.9), 0 1px 2px rgba(0,0,0,0.5), 0 3px 8px -2px rgba(0,0,0,0.55);

      --why-accent: #60a5fa;
      --trap-accent: #f87171;
      --formula-accent: #a78bfa;
      --errata-accent: #a3a3a3;
      --cloze-bg: rgba(250, 204, 21, 0.22);
      --cloze-ink: #fef08a;

      --paper: #1d1c19;
      --paper-rule: rgba(255, 255, 255, 0.06);
      --paper-margin: rgba(255, 110, 92, 0.24);
      --paper-tape: rgba(214, 196, 140, 0.36);
      --paper-curl: rgba(0, 0, 0, 0.55);
      color-scheme: dark;
    }

    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation-duration: 0.32s;
      animation-timing-function: ease;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-text);
      -webkit-font-smoothing: antialiased;
    }

    /* Ultra-thin Monochrome Reading Progress */
    .read-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      width: 0%;
      z-index: 60;
      background: var(--ink);
      transition: width 0.08s linear;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Monochrome Sticky Topbar */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      z-index: 30;
    }

    .chip {
      border: 1px solid;
      border-color: var(--key-rim) var(--key-rim) var(--key-rim-low);
      background: var(--key-sheen) var(--key-bg);
      height: 28px;
      box-shadow: var(--key-lift);
      color: var(--ink-soft);
      font: 500 12.5px/26px var(--font-text);
      cursor: pointer;
      border-radius: 8px;
      padding: 0 11px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: background-color 0.14s, box-shadow 0.14s, color 0.12s, translate 0.12s var(--ease-out);
    }
    .chip:hover { background-color: var(--key-bg-hover); color: var(--ink); }
    .chip:active { box-shadow: var(--key-down); translate: 0 1px; }
    .chip.active,
    .chip[data-pressed="true"] {
      border-color: var(--ink-key-rim);
      background: var(--ink-key-sheen) var(--ink-key-bg);
      box-shadow: var(--ink-key-lift);
      color: var(--ink-key-text);
    }

    .topic-pills {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 2px 0;
    }
    .topic-pills::-webkit-scrollbar { display: none; }
    .topic-pill {
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 7px;
      color: var(--ink-soft);
      white-space: nowrap;
      transition: background-color 0.14s, color 0.14s;
    }
    .topic-pill:hover:not(.disabled) { background: var(--quiet-hover); color: var(--ink); }
    .topic-pill.active {
      background: var(--ink);
      color: var(--on-ink);
      font-weight: 600;
    }
    .topic-pill.disabled { opacity: 0.35; pointer-events: none; }

    .controls {
      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .layout-group {
      display: inline-flex;
      gap: 4px;
    }

    /* Physics Stretch Toggle Switch (vibedesign.tips exact knob physics) */
    .cloze-control {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 28px;
      padding: 0 8px 0 10px;
      border-radius: 8px;
      border: 1px solid var(--line-strong);
      background: var(--bg);
      color: var(--ink);
      font: 500 12.5px/1 var(--font-text);
      cursor: pointer;
      user-select: none;
      transition: background-color 0.14s;
    }
    .cloze-control:hover { background: var(--quiet-hover); }
    .stretch-switch {
      --on: 0;
      --track: var(--quiet-down-bg);
      --knob: #ffffff;
      --travel: 14px;
      --stretch: 0px;
      --stretch-n: 0;
      --knob-move: 0.3s cubic-bezier(0.3, 0.7, 0.1, 1);
      position: relative;
      width: 34px;
      height: 20px;
      border-radius: 999px;
      background: var(--track);
      box-shadow: var(--quiet-down);
      transition: background-color 0.22s;
      flex: none;
    }
    .stretch-knob {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--knob);
      filter: drop-shadow(0 0 0.5px rgba(0,0,0,0.2)) drop-shadow(0 1.5px 2px rgba(0,0,0,0.2));
      translate: calc(var(--on) * var(--travel)) 0;
      transition: translate var(--knob-move), background-color 0.22s ease;
    }
    .stretch-knob::before,
    .stretch-knob::after {
      content: "";
      position: absolute;
      background: var(--knob);
    }
    .stretch-knob::before {
      top: 0;
      left: 7.5px;
      width: 1px;
      height: 16px;
      scale: var(--stretch-n) 1;
      translate: calc((1 - 2 * var(--on)) * var(--stretch) / 2) 0;
      transition: translate var(--knob-move) 60ms, scale var(--knob-move) 60ms;
    }
    .stretch-knob::after {
      inset: 0;
      border-radius: 50%;
      translate: calc((1 - 2 * var(--on)) * var(--stretch)) 0;
      transition: translate var(--knob-move) 60ms;
    }
    .cloze-control:active .stretch-switch {
      --stretch: 5px;
      --stretch-n: 5;
    }
    .cloze-control:active .stretch-knob::before,
    .cloze-control:active .stretch-knob::after {
      transition-delay: 0s;
    }
    .cloze-control.active .stretch-switch {
      --on: 1;
      --track: var(--ink);
      --knob: var(--on-ink);
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 9px;
      border-radius: 8px;
      background: var(--surface);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.05), inset 0 0 0 1px var(--line);
    }
    .search-box:focus-within {
      background: var(--bg);
      box-shadow: inset 0 0 0 1.5px var(--ink);
    }
    .search-box input {
      border: 0;
      background: transparent;
      color: var(--ink);
      outline: none;
      font-size: 12.5px;
      width: 120px;
    }
    .search-count { font: 500 10.5px/1 var(--font-mono); color: var(--ink-faint); font-variant-numeric: tabular-nums; }
    kbd {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 4px;
      background: var(--bg);
      color: var(--ink-faint);
      box-shadow: inset 0 -1px 0 var(--line-strong), 0 0 0 1px var(--line);
    }

    .quiet-btn {
      width: 28px;
      height: 28px;
      border: 0;
      background: transparent;
      color: var(--ink-soft);
      border-radius: 8px;
      cursor: pointer;
      display: inline-grid;
      place-items: center;
      font-size: 14px;
      transition: background-color 0.12s, color 0.12s;
    }
    .quiet-btn:hover { background: var(--quiet-hover); color: var(--ink); }
    .quiet-btn[data-off="true"] { opacity: 0.45; }

    /* Draggable Split Workspace */
    .workspace {
      --split-left: 42%;
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(260px, var(--split-left)) 6px minmax(0, 1fr);
    }
    .workspace.mode-doc { grid-template-columns: 0 0 minmax(0, 1fr); }
    .workspace.mode-doc .mindmap-pane,
    .workspace.mode-doc .split-resizer { display: none; }
    .workspace.mode-mindmap { grid-template-columns: minmax(0, 1fr) 0 0; }
    .workspace.mode-mindmap .doc-pane,
    .workspace.mode-mindmap .split-resizer { display: none; }

    .mindmap-pane {
      position: relative;
      background: var(--surface);
      overflow: hidden;
    }
    #mindmapSvg { width: 100%; height: 100%; display: block; }
    .mindmap-pane svg text { fill: var(--ink) !important; cursor: pointer; }
    .mindmap-pane svg a { fill: var(--ink) !important; text-decoration: none; }
    .mindmap-pane .markmap-foreign,
    .mindmap-pane .markmap-foreign a {
      color: var(--ink) !important;
      text-decoration: none;
      cursor: pointer;
    }
    .mindmap-pane .markmap-foreign a:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .mindmap-hint {
      position: absolute;
      left: 14px;
      bottom: 14px;
      font-size: 11.5px;
      color: var(--ink-soft);
      background: color-mix(in srgb, var(--bg) 86%, transparent);
      backdrop-filter: blur(8px);
      border: 1px solid var(--line);
      padding: 5px 11px;
      border-radius: 999px;
      pointer-events: none;
    }
    .mindmap-zoom-controls {
      position: absolute;
      right: 14px;
      bottom: 14px;
      display: flex;
      gap: 6px;
    }

    /* Resizer Handle */
    .split-resizer {
      position: relative;
      cursor: col-resize;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      z-index: 10;
    }
    .split-resizer::before {
      content: "";
      width: 1px;
      height: 100%;
      background: var(--line);
      transition: background-color 0.15s, width 0.15s;
    }
    .split-resizer::after {
      content: "";
      position: absolute;
      width: 4px;
      height: 36px;
      border-radius: 999px;
      background: var(--line-strong);
      opacity: 0;
      transition: opacity 0.16s ease;
    }
    .split-resizer:hover::before,
    .split-resizer[data-dragging="true"]::before {
      background: var(--ink);
    }
    .split-resizer:hover::after,
    .split-resizer[data-dragging="true"]::after {
      opacity: 1;
    }

    /* Editorial Document Pane */
    .doc-pane {
      overflow-y: auto;
      padding: 36px clamp(20px, 4.5vw, 56px) 96px;
      scroll-behavior: smooth;
    }
    .doc-inner { max-width: 780px; margin: 0 auto; }

    .doc-hero {
      padding-bottom: 22px;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--line);
    }
    .doc-meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font: 500 11.5px/1 var(--font-mono);
      color: var(--ink-faint);
      letter-spacing: 0.03em;
    }
    .meta-pill {
      padding: 4px 8px;
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink-soft);
      box-shadow: inset 0 0 0 1px var(--line);
    }
    .doc-summary {
      margin: 12px 0 0;
      font-size: 14.5px;
      color: var(--ink-soft);
      line-height: 1.65;
    }

    /* Cloze Toolbar Banner */
    .cloze-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      margin-bottom: 24px;
      border-radius: 10px;
      background: var(--surface);
      box-shadow: inset 0 0 0 1px var(--line-strong);
      font-size: 13px;
      flex-wrap: wrap;
    }
    .cloze-active .cloze-banner { display: flex; }

    /* Prose Typography */
    .prose { font-size: 15.5px; line-height: 1.8; }
    .prose h1, .prose h2, .prose h3, .prose h4 {
      scroll-margin-top: 24px;
      line-height: 1.32;
      text-wrap: balance;
      letter-spacing: -0.022em;
    }
    .prose h1 { font-size: 30px; margin: 0 0 16px; }
    .prose h2 {
      font-size: 20px;
      margin: 40px 0 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }
    .prose h3 { font-size: 17px; margin: 26px 0 10px; }
    .prose h4 { font-size: 15px; margin: 18px 0 8px; color: var(--ink-soft); }
    .heading-anchor {
      margin-left: 8px;
      color: var(--ink-faint);
      text-decoration: none;
      font-weight: 400;
      opacity: 0;
      transition: opacity 0.14s ease, color 0.14s ease;
    }
    .doc-heading:hover .heading-anchor,
    .heading-anchor:focus-visible { opacity: 1; }
    .heading-anchor:hover { color: var(--ink); }
    .prose ul, .prose ol { padding-left: 22px; }
    .prose li { margin: 5px 0; }
    .prose code {
      font-family: var(--font-mono);
      font-size: 0.87em;
      background: var(--surface);
      padding: 2px 6px;
      border-radius: 5px;
      box-shadow: inset 0 0 0 1px var(--line);
    }

    .heading-flash {
      animation: headingPulse 1.4s var(--ease-out);
      border-radius: 6px;
    }
    @keyframes headingPulse {
      0% { background: color-mix(in srgb, var(--ink) 14%, transparent); box-shadow: 0 0 0 6px color-mix(in srgb, var(--ink) 8%, transparent); }
      100% { background: transparent; box-shadow: 0 0 0 0 transparent; }
    }

    /* Editorial Tables */
    .table-wrap {
      overflow-x: auto;
      margin: 18px 0 24px;
      border-radius: 10px;
      box-shadow: 0 0 0 1px var(--line);
    }
    .prose table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .prose th, .prose td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    .prose th {
      background: var(--surface);
      font-weight: 600;
      font-size: 12.5px;
      color: var(--ink-soft);
    }
    .prose tbody tr:hover td { background: color-mix(in srgb, var(--surface) 60%, transparent); }
    .prose tr:last-child td { border-bottom: 0; }

    /* 5 Editorial Semantic Callouts */
    .callout {
      margin: 22px 0;
      padding: 15px 18px;
      border-radius: 10px;
      background: var(--bg);
      box-shadow: inset 0 0 0 1px var(--line);
      border-left: 3px solid var(--ink);
    }
    .callout-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 6px;
    }
    .callout-title::after {
      margin-left: auto;
      font: 600 9.5px/1 var(--font-mono);
      letter-spacing: 0.08em;
      padding: 3px 6px;
      border-radius: 4px;
      background: var(--surface);
      color: var(--ink-faint);
    }
    .callout-body > *:first-child { margin-top: 0; }
    .callout-body > *:last-child { margin-bottom: 0; }

    .callout-why { border-left-color: var(--why-accent); }
    .callout-why .callout-title::after { content: "LOGIC"; color: var(--why-accent); }

    .callout-trap { border-left-color: var(--trap-accent); }
    .callout-trap .callout-title::after { content: "TRAP"; color: var(--trap-accent); }

    .callout-formula { border-left-color: var(--formula-accent); background: var(--surface); }
    .callout-formula .callout-title::after { content: "FORMULA"; color: var(--formula-accent); }

    .callout-errata { border-left-color: var(--errata-accent); background: var(--surface); }
    .callout-errata summary { cursor: pointer; list-style: none; margin-bottom: 0; color: var(--ink-soft); }
    .callout-errata summary::-webkit-details-marker { display: none; }
    .callout-errata summary::after { content: "ERRATA"; }
    .callout-errata[open] summary { margin-bottom: 8px; }
    .callout-toggle-hint {
      font: 500 11px/1 var(--font-mono);
      color: var(--ink-faint);
    }
    .callout-errata[open] .callout-toggle-hint { display: none; }

    /* Taped Lined-Paper Mnemonic Card inside Chapter */
    .callout-mnemonic {
      --rule-h: 28px;
      position: relative;
      margin: 30px 0 26px;
      padding: var(--rule-h) 20px 22px 42px;
      border: 0;
      border-radius: 2px;
      background:
        linear-gradient(90deg, transparent 27px, var(--paper-margin) 27px 28px, transparent 28px),
        repeating-linear-gradient(transparent 0 calc(var(--rule-h) - 1px), var(--paper-rule) calc(var(--rule-h) - 1px) var(--rule-h)) 0 -3px,
        var(--paper);
      box-shadow: 0 0 0 0.5px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.06), 0 12px 18px -12px var(--paper-curl);
    }
    .callout-mnemonic::before {
      content: "";
      position: absolute;
      top: -11px;
      left: 50%;
      width: 96px;
      height: 22px;
      translate: -50%;
      rotate: -1.4deg;
      background: linear-gradient(rgba(255,255,255,0.3), transparent 60%), var(--paper-tape);
      clip-path: polygon(0 0, 100% 0, calc(100% - 3px) 20%, 100% 40%, calc(100% - 3px) 60%, 100% 80%, calc(100% - 2px) 100%, 0 100%, 3px 80%, 0 60%, 3px 40%, 0 20%);
    }
    .callout-mnemonic .callout-title {
      line-height: var(--rule-h);
      margin-bottom: 4px;
    }
    .callout-mnemonic .callout-title::after { content: "MNEMONIC"; }
    .callout-mnemonic .callout-body { line-height: var(--rule-h); }

    /* Cloze Mask Mode */
    mark.cloze-mark {
      background: var(--cloze-bg);
      color: var(--cloze-ink);
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
      transition: filter 0.22s ease, opacity 0.22s ease, background-color 0.22s ease;
    }
    .cloze-active mark.cloze-mark:not([data-revealed="true"]) {
      background: var(--surface);
      color: var(--ink);
      filter: blur(5.5px);
      cursor: pointer;
      user-select: none;
      box-shadow: inset 0 0 0 1px var(--line-strong);
    }
    .cloze-active mark.cloze-mark:not([data-revealed="true"]):hover { filter: blur(2.5px); }
    .cloze-active mark.cloze-mark[data-revealed="true"] { filter: blur(0); cursor: pointer; }

    .cloze-active .prose td:not(:first-child) { position: relative; cursor: pointer; }
    .cloze-active .prose td:not(:first-child):not([data-revealed="true"]) {
      color: transparent !important;
      text-shadow: 0 0 9px var(--ink-faint);
      user-select: none;
    }
    .cloze-active .prose td:not(:first-child):not([data-revealed="true"]) * {
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .cloze-active .prose td:not(:first-child):not([data-revealed="true"])::after {
      content: "点击揭晓";
      position: absolute;
      left: 14px;
      top: 10px;
      font-size: 11.5px;
      white-space: nowrap;
      color: var(--ink-faint);
      text-shadow: none;
      pointer-events: none;
    }
    @media (hover: hover) {
      .cloze-active .prose td:not(:first-child):not([data-revealed="true"]):hover {
        color: inherit !important;
        text-shadow: none;
      }
      .cloze-active .prose td:not(:first-child):not([data-revealed="true"]):hover * { opacity: 1; }
      .cloze-active .prose td:not(:first-child):not([data-revealed="true"]):hover::after { display: none; }
    }

    mark.search-hit { background: #fde047; color: #111; border-radius: 3px; padding: 0 2px; }
    mark.search-hit.current-hit { outline: 2px solid #dc2626; }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translate(-50%, 16px);
      opacity: 0;
      pointer-events: none;
      z-index: 80;
      padding: 9px 18px;
      border-radius: 999px;
      background: var(--ink);
      color: var(--on-ink);
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: 0 14px 32px -8px rgba(0,0,0,0.4);
      transition: opacity 0.2s ease, transform 0.28s var(--ease-spring);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    :root[data-motion="off"] .doc-pane { scroll-behavior: auto; }
    :root[data-motion="off"] *,
    :root[data-motion="off"] *::before,
    :root[data-motion="off"] *::after {
      animation: none !important;
      transition-duration: 0.01ms !important;
    }

    /* Section Star Button (☆ / ★) */
    .heading-star {
      margin-left: 8px;
      border: 0;
      background: transparent;
      color: var(--ink-faint);
      font-size: 0.85em;
      line-height: 1;
      padding: 2px 5px;
      border-radius: 6px;
      cursor: pointer;
      vertical-align: middle;
      opacity: 0;
      transition: opacity 0.14s ease, color 0.14s ease, background-color 0.14s ease, transform 0.14s ease;
    }
    .doc-heading:hover .heading-star,
    .heading-star:focus-visible,
    .heading-star[data-starred="true"] {
      opacity: 1;
    }
    .heading-star:hover { background: var(--quiet-hover); color: var(--ink); }
    .heading-star[data-starred="true"] { color: #d97706; }
    :root[data-theme="dark"] .heading-star[data-starred="true"] { color: #fbbf24; }

    /* End-of-Chapter Review Check-in Bar */
    .chapter-footer-review {
      margin-top: 48px;
      padding: 18px 20px;
      border-radius: 14px;
      background: var(--surface);
      box-shadow: inset 0 0 0 1px var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    .chapter-footer-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .chapter-footer-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
    }
    .chapter-footer-sub {
      font-size: 12px;
      color: var(--ink-soft);
      font-family: var(--font-mono);
    }

    /* Cross-Topic Command Palette (⌘K / Ctrl+K) */
    .cmd-backdrop {
      position: fixed;
      inset: 0;
      z-index: 75;
      background: rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: min(12vh, 96px) 16px 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }
    .cmd-backdrop.open { opacity: 1; pointer-events: auto; }
    .cmd-dialog {
      width: min(640px, 100%);
      max-height: min(72vh, 560px);
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 0 1px var(--line-strong), 0 32px 90px -20px rgba(0,0,0,0.48);
      transform: translateY(-8px) scale(0.98);
      transition: transform 0.22s var(--ease-out);
    }
    .cmd-backdrop.open .cmd-dialog { transform: translateY(0) scale(1); }
    .cmd-input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 16px;
      border-bottom: 1px solid var(--line);
    }
    .cmd-input-row input {
      flex: 1;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--ink);
      font-size: 15px;
      font-family: var(--font-text);
    }
    .cmd-results {
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .cmd-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 12px;
      border-radius: 10px;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      transition: background-color 0.1s ease;
    }
    .cmd-item:hover,
    .cmd-item[data-active="true"] {
      background: var(--surface);
      box-shadow: inset 0 0 0 1px var(--line-strong);
    }
    .cmd-item-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 600;
    }
    .cmd-topic-tag {
      font: 600 10.5px/1 var(--font-mono);
      padding: 3px 6px;
      border-radius: 5px;
      background: var(--ink);
      color: var(--on-ink);
      flex: none;
    }
    .cmd-snippet {
      font-size: 12px;
      color: var(--ink-soft);
      line-height: 1.5;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    mark.cmd-hit {
      background: #fef08a;
      color: #111;
      border-radius: 3px;
      padding: 0 2px;
    }
    .cmd-empty {
      padding: 28px 16px;
      text-align: center;
      color: var(--ink-faint);
      font-size: 13px;
    }
    .cmd-suggests {
      margin-top: 12px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .cmd-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      border-top: 1px solid var(--line);
      background: var(--surface);
      font: 500 11px/1 var(--font-mono);
      color: var(--ink-faint);
    }

    @media (max-width: 900px) {
      .topbar { padding: 8px 10px; gap: 6px; }
      .controls {
        margin-left: 0;
        width: 100%;
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
        padding-bottom: 2px;
      }
      .controls::-webkit-scrollbar { display: none; }
      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: 42vh 0 minmax(0, 1fr);
      }
      .split-resizer { display: none; }
      .workspace.mode-doc { grid-template-rows: 0 0 minmax(0, 1fr); }
      .workspace.mode-mindmap { grid-template-rows: minmax(0, 1fr) 0 0; }
      .mindmap-pane { border-bottom: 1px solid var(--line); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* Clean Handout Print Stylesheet */
    @media print {
      @page { margin: 14mm 15mm; }
      :root, :root[data-theme="dark"] {
        --bg: #ffffff;
        --surface: #f7f7f7;
        --ink: #000000;
        --ink-soft: #333333;
        --ink-faint: #555555;
        --line: #d4d4d4;
        --line-strong: #999999;
      }
      html, body {
        height: auto !important;
        background: #ffffff !important;
        color: #000000 !important;
        font-size: 11pt;
      }
      .read-progress,
      .topbar,
      .mindmap-pane,
      .split-resizer,
      .cloze-banner,
      .heading-anchor,
      .heading-star,
      .callout-toggle-hint,
      .chapter-footer-review,
      .cmd-backdrop,
      .toast {
        display: none !important;
      }
      .app,
      .workspace,
      .doc-pane {
        display: block !important;
        height: auto !important;
        overflow: visible !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .doc-inner { max-width: 100% !important; }
      .prose { font-size: 10.5pt; line-height: 1.65; }
      .prose h1, .prose h2, .prose h3, .prose h4 {
        break-after: avoid;
        page-break-after: avoid;
      }
      .prose h2 { margin-top: 22pt; border-bottom: 1px solid #999; }
      .table-wrap { box-shadow: none; border: 1px solid #999; border-radius: 0; overflow: visible; }
      .prose table { font-size: 9.5pt; }
      .prose thead { display: table-header-group; }
      .prose th, .prose td { border: 1px solid #bbb !important; padding: 5pt 7pt; color: #000 !important; text-shadow: none !important; }
      .prose td * { opacity: 1 !important; }
      .prose td::after { display: none !important; }
      .prose tr, .callout { break-inside: avoid; page-break-inside: avoid; }
      .callout {
        box-shadow: none !important;
        border: 1px solid #bbb !important;
        border-left: 3px solid #222 !important;
        background: #ffffff !important;
      }
      .callout-mnemonic {
        padding: 12pt 14pt !important;
        margin: 14pt 0 !important;
        background: #fafafa !important;
        border: 1px dashed #666 !important;
        border-left: 3px solid #111 !important;
      }
      .callout-mnemonic::before { display: none !important; }
      mark.cloze-mark {
        filter: none !important;
        background: transparent !important;
        color: #000000 !important;
        border-bottom: 1.5px solid #000000;
        border-radius: 0;
        padding: 0 2px;
      }
    }
  </style>
</head>
<body>
  <div class="read-progress" id="readProgress"></div>

  <div class="app">
    <header class="topbar">
      <a class="chip" href="index.html">← 全部专题</a>

      <nav class="topic-pills" aria-label="专题切换">
        {{TOPIC_PILLS}}
      </nav>

      <div class="controls">
        <div class="layout-group" id="layoutGroup">
          <button class="chip active" data-layout="split" type="button">分栏</button>
          <button class="chip" data-layout="doc" type="button">文档</button>
          <button class="chip" data-layout="mindmap" type="button">导图</button>
        </div>

        <button class="cloze-control" id="clozeToggle" type="button" title="快捷键 M 切换背诵遮罩">
          <span>背诵遮罩</span>
          <span class="stretch-switch" aria-hidden="true"><span class="stretch-knob"></span></span>
        </button>

        <label class="search-box" title="快捷键 /">
          <span style="color:var(--ink-faint); font-size:12px;">⌕</span>
          <input id="pageSearch" type="search" placeholder="页内检索…" />
          <span class="search-count" id="searchCount"></span>
          <kbd>/</kbd>
        </label>

        <button class="chip" id="openCmdPalette" type="button" title="跨专题全局秒搜（⌘K / Ctrl+K）">
          <span>跨专题</span>
          <kbd>⌘K</kbd>
        </button>

        <button class="chip" id="reviewToggle" type="button" title="记录本专题今日复习打卡">✓ 标记今日已复习</button>
        <button class="chip" id="copyMuseTopicBtn" type="button" title="复制 Muse 增量更新此专题的指令">＋ 补充笔记</button>
        <button class="quiet-btn" id="motionToggle" type="button" title="开关动效">✦</button>
        <button class="quiet-btn" id="themeToggle" type="button" title="切换明暗主题">◐</button>
      </div>
    </header>

    <div class="workspace" id="workspace">
      <aside class="mindmap-pane">
        <svg id="mindmapSvg"></svg>
        <div class="mindmap-hint">点击导图节点定位文档 · 滚轮缩放 · 拖拽右侧分隔线调宽</div>
        <div class="mindmap-zoom-controls">
          <button class="chip" id="fitMindmapBtn" type="button" title="重置导图视角">⌖ 居中</button>
        </div>
      </aside>

      <div class="split-resizer" id="splitResizer" title="左右拖拽调节导图与文档宽度"></div>

      <main class="doc-pane" id="docPane">
        <div class="doc-inner">
          <div class="doc-hero">
            <div class="doc-meta-row">
              <span class="meta-pill">NO.{{ORDER}}</span>
              <span class="meta-pill">{{CLOZE_COUNT}} 处挖空</span>
              <span class="meta-pill">{{WHY_COUNT}} 个底层逻辑</span>
              <span>UPDATED {{UPDATED}}</span>
            </div>
            <p class="doc-summary">{{SUMMARY}}</p>
          </div>

          <div class="cloze-banner" id="clozeBanner">
            <span><strong>背诵自测已开启</strong>：点击模糊词或表格单元格揭晓（已揭晓 <strong id="revealedStat">0</strong> 处）</span>
            <div style="display:flex; gap:6px;">
              <button class="chip" id="revealAllBtn" type="button">全部揭晓</button>
              <button class="chip" id="resetClozeBtn" type="button">重置遮罩</button>
            </div>
          </div>

          <article class="prose" id="docContent">
            {{CONTENT_HTML}}
          </article>

          <div class="chapter-footer-review">
            <div class="chapter-footer-meta">
              <span class="chapter-footer-title">本专题复习打卡 · {{TITLE}}</span>
              <span class="chapter-footer-sub" id="reviewFooterSub">尚未打卡 · 点击右侧按钮记录本次复习</span>
            </div>
            <button class="chip" id="reviewFooterBtn" type="button">✓ 标记今日已复习</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Cross-Topic Command Palette (⌘K / Ctrl+K) -->
  <div class="cmd-backdrop" id="cmdPalette" aria-hidden="true">
    <div class="cmd-dialog" role="dialog" aria-modal="true" aria-label="跨专题全局搜索">
      <div class="cmd-input-row">
        <span style="color:var(--ink-faint); font-size:15px;">⌕</span>
        <input id="cmdInput" type="search" placeholder="跨 7 大专题秒搜知识点（如 hospital、university、for sb、反意疑问句）…" autocomplete="off" />
        <kbd>ESC</kbd>
      </div>
      <div class="cmd-results" id="cmdResults"></div>
      <div class="cmd-foot">
        <span>↑ ↓ 选择 · Enter 直达小节</span>
        <span id="cmdStatus">0 RESULTS</span>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script id="mindmapData" type="application/json">{{MINDMAP_JSON}}</script>
  <script>
    const TOPIC_ID = {{TOPIC_ID_JSON}};
    const TOPIC_TITLE = {{TITLE_JSON}};
    const SEARCH_INDEX = {{SEARCH_INDEX_JSON}};
    const root = document.documentElement;
    const workspace = document.getElementById('workspace');
    const docPane = document.getElementById('docPane');
    const docContent = document.getElementById('docContent');

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeRegExp(str) {
      return String(str).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // Theme toggle (View Transition)
    root.dataset.theme = localStorage.getItem('muse-grammar-theme') || 'light';
    document.getElementById('themeToggle').addEventListener('click', () => {
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      const apply = () => {
        root.dataset.theme = next;
        localStorage.setItem('muse-grammar-theme', next);
      };
      if (document.startViewTransition && root.dataset.motion !== 'off') {
        document.startViewTransition(apply);
      } else {
        apply();
      }
    });

    // Motion toggle
    const motionBtn = document.getElementById('motionToggle');
    function applyMotionPref(off) {
      root.dataset.motion = off ? 'off' : 'on';
      motionBtn.dataset.off = off ? 'true' : 'false';
      motionBtn.title = off ? '当前：静谧模式（点击开启动效）' : '当前：物理动效开启（点击切静谧模式）';
    }
    applyMotionPref(localStorage.getItem('muse-grammar-motion') === 'off');
    motionBtn.addEventListener('click', () => {
      const nextOff = root.dataset.motion !== 'off';
      localStorage.setItem('muse-grammar-motion', nextOff ? 'off' : 'on');
      applyMotionPref(nextOff);
      showToast(nextOff ? '已切换静谧刷题模式' : '已开启物理弹簧动效');
    });

    // Reading progress bar
    const progressEl = document.getElementById('readProgress');
    docPane.addEventListener('scroll', () => {
      const max = docPane.scrollHeight - docPane.clientHeight;
      const pct = max > 0 ? Math.min(100, Math.round((docPane.scrollTop / max) * 100)) : 0;
      progressEl.style.width = `${pct}%`;
    });

    // Layout mode switcher
    let mmInstance = null;
    const layoutGroup = document.getElementById('layoutGroup');
    layoutGroup.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-layout]');
      if (!btn) return;
      layoutGroup.querySelectorAll('button').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      workspace.className = `workspace mode-${btn.dataset.layout}`;
      if (mmInstance && btn.dataset.layout !== 'doc') {
        setTimeout(() => mmInstance.fit(), 80);
      }
    });

    // Draggable Split Resizer
    const savedSplitRaw = parseFloat(localStorage.getItem('muse-grammar-split') || '');
    if (Number.isFinite(savedSplitRaw) && savedSplitRaw >= 24 && savedSplitRaw <= 68) {
      workspace.style.setProperty('--split-left', `${savedSplitRaw.toFixed(1)}%`);
    }
    const resizer = document.getElementById('splitResizer');
    resizer.addEventListener('dblclick', () => {
      workspace.style.setProperty('--split-left', '42%');
      localStorage.setItem('muse-grammar-split', '42%');
      if (mmInstance) setTimeout(() => mmInstance.fit(), 40);
    });
    resizer.addEventListener('pointerdown', (e) => {
      if (window.innerWidth <= 900) return;
      e.preventDefault();
      resizer.dataset.dragging = 'true';
      document.body.style.userSelect = 'none';
      resizer.setPointerCapture(e.pointerId);
      const onMove = (ev) => {
        const pct = Math.min(68, Math.max(24, (ev.clientX / window.innerWidth) * 100));
        const val = `${pct.toFixed(1)}%`;
        workspace.style.setProperty('--split-left', val);
        localStorage.setItem('muse-grammar-split', val);
      };
      const onUp = () => {
        resizer.removeAttribute('data-dragging');
        document.body.style.userSelect = '';
        resizer.removeEventListener('pointermove', onMove);
        resizer.removeEventListener('pointerup', onUp);
        resizer.removeEventListener('pointercancel', onUp);
        if (mmInstance) setTimeout(() => mmInstance.fit(), 40);
      };
      resizer.addEventListener('pointermove', onMove);
      resizer.addEventListener('pointerup', onUp);
      resizer.addEventListener('pointercancel', onUp);
    });

    // Cloze mode with Physics Stretch Switch
    const clozeToggle = document.getElementById('clozeToggle');
    function updateRevealedCount() {
      const count = docContent.querySelectorAll('[data-revealed="true"]').length;
      const el = document.getElementById('revealedStat');
      if (el) el.textContent = String(count);
    }
    function setClozeMode(enabled) {
      document.body.classList.toggle('cloze-active', enabled);
      clozeToggle.classList.toggle('active', enabled);
      if (!enabled) {
        docContent.querySelectorAll('[data-revealed]').forEach((el) => el.removeAttribute('data-revealed'));
      }
      updateRevealedCount();
    }
    clozeToggle.addEventListener('click', () => {
      setClozeMode(!document.body.classList.contains('cloze-active'));
    });

    docContent.addEventListener('click', (e) => {
      if (!document.body.classList.contains('cloze-active')) return;
      const td = e.target.closest('td:not(:first-child)');
      if (td && td.getAttribute('data-revealed') !== 'true') {
        td.setAttribute('data-revealed', 'true');
        updateRevealedCount();
        return;
      }
      const mark = e.target.closest('mark.cloze-mark');
      if (mark) {
        const revealed = mark.getAttribute('data-revealed') === 'true';
        mark.setAttribute('data-revealed', revealed ? 'false' : 'true');
        updateRevealedCount();
        return;
      }
      if (td) {
        const revealed = td.getAttribute('data-revealed') === 'true';
        td.setAttribute('data-revealed', revealed ? 'false' : 'true');
        updateRevealedCount();
      }
    });
    docContent.addEventListener('keydown', (e) => {
      if (!document.body.classList.contains('cloze-active')) return;
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const mark = e.target.closest('mark.cloze-mark');
      if (!mark) return;
      e.preventDefault();
      const td = mark.closest('td:not(:first-child)');
      if (td && td.getAttribute('data-revealed') !== 'true') {
        td.setAttribute('data-revealed', 'true');
      } else {
        const revealed = mark.getAttribute('data-revealed') === 'true';
        mark.setAttribute('data-revealed', revealed ? 'false' : 'true');
      }
      updateRevealedCount();
    });

    document.getElementById('revealAllBtn').addEventListener('click', () => {
      docContent.querySelectorAll('mark.cloze-mark, td:not(:first-child)').forEach((el) => {
        el.setAttribute('data-revealed', 'true');
      });
      updateRevealedCount();
    });
    document.getElementById('resetClozeBtn').addEventListener('click', () => {
      docContent.querySelectorAll('[data-revealed]').forEach((el) => el.removeAttribute('data-revealed'));
      updateRevealedCount();
    });

    // Copy Muse incremental update prompt for current topic
    document.getElementById('copyMuseTopicBtn').addEventListener('click', async () => {
      const prompt = `请先读取仓库根目录的 SKILL.md 和 schema/topics.json，再读取 notes/${TOPIC_ID}.md。我将上传「${TOPIC_TITLE}」专题的新增手写笔记照片，请你按 SKILL.md 规范识图、去重、修正笔误、补充 > [!why] 底层逻辑并增量合并到 notes/${TOPIC_ID}.md。`;
      try {
        await navigator.clipboard.writeText(prompt);
        showToast(`已复制「${TOPIC_TITLE}」的 Muse 增量更新指令`);
      } catch {
        showToast('剪贴板受限，请手动复制');
      }
    });

    // Render Markmap
    function scrollToSlug(slug) {
      if (!slug) return;
      const target = document.getElementById(slug);
      if (!target) return;
      if (workspace.classList.contains('mode-mindmap')) {
        layoutGroup.querySelector('[data-layout="split"]')?.click();
      }
      target.scrollIntoView({ behavior: root.dataset.motion === 'off' ? 'auto' : 'smooth', block: 'start' });
      target.classList.remove('heading-flash');
      void target.offsetWidth;
      target.classList.add('heading-flash');
    }

    (function initMindmap() {
      const raw = JSON.parse(document.getElementById('mindmapData').textContent || '""');
      const svg = document.getElementById('mindmapSvg');
      if (!window.markmap || !raw) return;

      const { Transformer, Markmap } = window.markmap;
      const transformer = new Transformer();
      const { root: tree } = transformer.transform(raw);
      mmInstance = Markmap.create(svg, { autoFit: true, duration: 280 }, tree);

      document.getElementById('fitMindmapBtn').addEventListener('click', () => mmInstance?.fit());

      svg.addEventListener('click', (e) => {
        const anchor = e.target.closest('a');
        if (anchor) {
          const href = anchor.getAttribute('href') || '';
          if (href.startsWith('#')) {
            e.preventDefault();
            scrollToSlug(decodeURIComponent(href.slice(1)));
          }
          return;
        }
        const nodeG = e.target.closest('g.markmap-node');
        if (nodeG) {
          const a = nodeG.querySelector('a');
          if (a) {
            const href = a.getAttribute('href') || '';
            if (href.startsWith('#')) {
              e.preventDefault();
              scrollToSlug(decodeURIComponent(href.slice(1)));
            }
          }
        }
      });
    })();

    // In-page search highlighting
    const searchInput = document.getElementById('pageSearch');
    const searchCount = document.getElementById('searchCount');
    let searchHits = [];
    let currentHitIndex = -1;

    function clearSearchHighlights() {
      docContent.querySelectorAll('mark.search-hit').forEach((mark) => {
        const parent = mark.parentNode;
        parent.replaceChild(document.createTextNode(mark.textContent), mark);
        parent.normalize();
      });
      searchHits = [];
      currentHitIndex = -1;
      searchCount.textContent = '';
    }

    function highlightMatches(query) {
      clearSearchHighlights();
      if (!query) return;
      const lower = query.toLowerCase();
      const walker = document.createTreeWalker(docContent, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
          const tag = node.parentElement?.tagName;
          if (tag === 'SCRIPT' || tag === 'STYLE') return NodeFilter.FILTER_REJECT;
          if (node.parentElement?.closest('.heading-anchor, .heading-star')) return NodeFilter.FILTER_REJECT;
          return node.nodeValue.toLowerCase().includes(lower)
            ? NodeFilter.FILTER_ACCEPT
            : NodeFilter.FILTER_REJECT;
        },
      });

      const textNodes = [];
      while (walker.nextNode()) textNodes.push(walker.currentNode);

      for (const node of textNodes) {
        const text = node.nodeValue;
        const frag = document.createDocumentFragment();
        let lastIndex = 0;
        let idx = text.toLowerCase().indexOf(lower, lastIndex);
        while (idx !== -1) {
          if (idx > lastIndex) frag.appendChild(document.createTextNode(text.slice(lastIndex, idx)));
          const hit = document.createElement('mark');
          hit.className = 'search-hit';
          hit.textContent = text.slice(idx, idx + query.length);
          frag.appendChild(hit);
          searchHits.push(hit);
          lastIndex = idx + query.length;
          idx = text.toLowerCase().indexOf(lower, lastIndex);
        }
        if (lastIndex < text.length) frag.appendChild(document.createTextNode(text.slice(lastIndex)));
        node.parentNode.replaceChild(frag, node);
      }

      if (searchHits.length > 0) focusSearchHit(0);
      else searchCount.textContent = '0/0';
    }

    function focusSearchHit(idx) {
      if (!searchHits.length) return;
      searchHits.forEach((h) => h.classList.remove('current-hit'));
      currentHitIndex = (idx + searchHits.length) % searchHits.length;
      const hit = searchHits[currentHitIndex];
      let details = hit.closest('details');
      while (details) {
        details.open = true;
        details = details.parentElement?.closest('details') || null;
      }
      hit.classList.add('current-hit');
      hit.scrollIntoView({ behavior: root.dataset.motion === 'off' ? 'auto' : 'smooth', block: 'center' });
      searchCount.textContent = `${currentHitIndex + 1}/${searchHits.length}`;
    }

    searchInput.addEventListener('input', (e) => highlightMatches(e.target.value.trim()));
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && searchHits.length > 0) {
        e.preventDefault();
        focusSearchHit(e.shiftKey ? currentHitIndex - 1 : currentHitIndex + 1);
      }
    });

    // Dual-layer localStorage study system (Topic review check-in + Section stars)
    function readJsonStorage(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === 'object' ? parsed : fallback;
      } catch {
        return fallback;
      }
    }

    function getTodayIso() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function getReviews() {
      const data = readJsonStorage('muse-grammar-reviews', {});
      return Array.isArray(data) ? {} : data;
    }

    function saveReviews(reviews) {
      try {
        localStorage.setItem('muse-grammar-reviews', JSON.stringify(reviews));
      } catch {}
    }

    function getStars() {
      const data = readJsonStorage('muse-grammar-stars', []);
      return Array.isArray(data) ? data : [];
    }

    function saveStars(stars) {
      try {
        localStorage.setItem('muse-grammar-stars', JSON.stringify(stars));
      } catch {}
    }

    const reviewToggleBtn = document.getElementById('reviewToggle');
    const reviewFooterBtn = document.getElementById('reviewFooterBtn');
    const reviewFooterSub = document.getElementById('reviewFooterSub');

    function syncReviewUI() {
      const reviews = getReviews();
      const info = reviews[TOPIC_ID];
      const count = info?.count || 0;
      const lastDate = info?.lastDate || '';
      const isToday = lastDate === getTodayIso();

      if (count > 0) {
        const label = isToday ? `✓ 今日已复习 · 第 ${count} 次` : `✓ 已复习 ${count} 次 · 再打卡`;
        reviewToggleBtn.textContent = label;
        reviewFooterBtn.textContent = label;
        reviewToggleBtn.classList.toggle('active', isToday);
        reviewFooterBtn.classList.toggle('active', isToday);
        reviewFooterSub.textContent = `累计复习 ${count} 次 · 最近打卡 ${lastDate || '未知'}`;
      } else {
        reviewToggleBtn.textContent = '✓ 标记今日已复习';
        reviewFooterBtn.textContent = '✓ 标记今日已复习';
        reviewToggleBtn.classList.remove('active');
        reviewFooterBtn.classList.remove('active');
        reviewFooterSub.textContent = '尚未打卡 · 点击右侧按钮记录本次复习';
      }
    }

    function markReviewed() {
      const reviews = getReviews();
      const prev = reviews[TOPIC_ID] || { count: 0, lastDate: '' };
      const nextCount = (Number(prev.count) || 0) + 1;
      const today = getTodayIso();
      reviews[TOPIC_ID] = { count: nextCount, lastDate: today };
      saveReviews(reviews);
      syncReviewUI();
      showToast(`已打卡「${TOPIC_TITLE}」今日复习（累计第 ${nextCount} 次）`);
    }

    reviewToggleBtn.addEventListener('click', markReviewed);
    reviewFooterBtn.addEventListener('click', markReviewed);
    syncReviewUI();

    // Inject ☆ / ★ star buttons on h2 / h3 headings
    function extractHeadingTitle(h) {
      const clone = h.cloneNode(true);
      clone.querySelectorAll('.heading-anchor, .heading-star').forEach((n) => n.remove());
      return clone.textContent.trim();
    }

    function syncStarButtons() {
      const starredKeys = new Set(getStars().map((s) => s.key));
      docContent.querySelectorAll('.heading-star').forEach((btn) => {
        const on = starredKeys.has(btn.dataset.key);
        btn.dataset.starred = on ? 'true' : 'false';
        btn.textContent = on ? '★' : '☆';
        btn.title = on ? '已加入首页「★ 生疏考点速查」（点击取消）' : '收藏到首页「★ 生疏考点速查」';
      });
    }

    (function initSectionStars() {
      const headings = docContent.querySelectorAll('h2[id], h3[id]');
      headings.forEach((h) => {
        const slug = h.id;
        if (!slug) return;
        const headingText = extractHeadingTitle(h);
        const key = `${TOPIC_ID}#${slug}`;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'heading-star';
        btn.dataset.key = key;
        btn.dataset.slug = slug;
        btn.setAttribute('aria-label', `收藏小节 ${headingText}`);
        btn.textContent = '☆';
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const stars = getStars();
          const idx = stars.findIndex((s) => s.key === key);
          if (idx >= 0) {
            stars.splice(idx, 1);
            saveStars(stars);
            syncStarButtons();
            showToast(`已取消星标「${headingText}」`);
          } else {
            stars.unshift({
              key,
              topicId: TOPIC_ID,
              topicTitle: TOPIC_TITLE,
              slug,
              heading: headingText,
              starredAt: getTodayIso(),
            });
            saveStars(stars);
            syncStarButtons();
            showToast(`已加入首页「★ 生疏考点速查」`);
          }
        });
        const anchor = h.querySelector('.heading-anchor');
        if (anchor) h.insertBefore(btn, anchor);
        else h.appendChild(btn);
      });
      syncStarButtons();
    })();

    // Cross-Topic Command Palette (⌘K / Ctrl+K)
    const cmdPalette = document.getElementById('cmdPalette');
    const cmdInput = document.getElementById('cmdInput');
    const cmdResults = document.getElementById('cmdResults');
    const cmdStatus = document.getElementById('cmdStatus');
    let cmdMatches = [];
    let cmdActiveIdx = 0;

    function highlightKeyword(text, terms) {
      const str = String(text ?? '');
      const unique = [...new Set(terms.filter(Boolean))].sort((a, b) => b.length - a.length);
      if (!unique.length) return escapeHtml(str);
      const re = new RegExp(unique.map(escapeRegExp).join('|'), 'gi');
      let out = '';
      let lastIdx = 0;
      for (const m of str.matchAll(re)) {
        const idx = m.index ?? 0;
        if (idx > lastIdx) out += escapeHtml(str.slice(lastIdx, idx));
        out += `<mark class="cmd-hit">${escapeHtml(m[0])}</mark>`;
        lastIdx = idx + m[0].length;
      }
      if (lastIdx < str.length) out += escapeHtml(str.slice(lastIdx));
      return out;
    }

    function buildExcerpt(snippet, terms) {
      const text = String(snippet || '');
      if (!text) return '';
      const lower = text.toLowerCase();
      const sortedTerms = [...new Set(terms.filter(Boolean))].sort((a, b) => b.length - a.length);
      let pos = -1;
      for (const term of sortedTerms) {
        const idx = lower.indexOf(term.toLowerCase());
        if (idx !== -1) {
          pos = idx;
          break;
        }
      }
      if (pos === -1) return text.slice(0, 120) + (text.length > 120 ? '…' : '');
      const start = Math.max(0, pos - 34);
      const end = Math.min(text.length, pos + 86);
      return `${start > 0 ? '…' : ''}${text.slice(start, end)}${end < text.length ? '…' : ''}`;
    }

    function navigateToResult(item) {
      if (!item) return;
      if (item.topicId === TOPIC_ID) {
        closeCmdPalette();
        history.replaceState(null, '', `#${encodeURIComponent(item.slug)}`);
        scrollToSlug(item.slug);
      } else {
        window.location.href = `${item.topicId}.html#${encodeURIComponent(item.slug)}`;
      }
    }

    function renderCmdResults(rawQuery) {
      const q = String(rawQuery || '').trim();
      const terms = q.split(/\s+/).filter(Boolean);
      cmdResults.innerHTML = '';

      if (!terms.length) {
        cmdMatches = [];
        cmdActiveIdx = 0;
        cmdStatus.textContent = `${SEARCH_INDEX.length} SECTIONS INDEXED`;
        cmdResults.innerHTML = `
          <div class="cmd-empty">
            <div>输入英文单词、短语或中文语法名，跨 7 大专题直达小节</div>
            <div class="cmd-suggests">
              <button class="chip" type="button" data-suggest="hospital">hospital</button>
              <button class="chip" type="button" data-suggest="university">university</button>
              <button class="chip" type="button" data-suggest="for sb">for sb</button>
              <button class="chip" type="button" data-suggest="反意疑问句">反意疑问句</button>
            </div>
          </div>
        `;
        cmdResults.querySelectorAll('[data-suggest]').forEach((btn) => {
          btn.addEventListener('click', () => {
            cmdInput.value = btn.dataset.suggest;
            renderCmdResults(cmdInput.value);
            cmdInput.focus();
          });
        });
        return;
      }

      const scored = [];
      for (const entry of SEARCH_INDEX) {
        const hayHeading = `${entry.topicTitle} ${entry.heading}`.toLowerCase();
        const hayAll = `${hayHeading} ${entry.snippet || ''}`.toLowerCase();
        if (!terms.every((t) => hayAll.includes(t.toLowerCase()))) continue;
        let score = 0;
        for (const t of terms) {
          const tl = t.toLowerCase();
          if (entry.heading.toLowerCase().includes(tl)) score += 6;
          if (entry.topicTitle.toLowerCase().includes(tl)) score += 3;
          if ((entry.snippet || '').toLowerCase().includes(tl)) score += 1;
        }
        scored.push({ entry, score });
      }
      scored.sort((a, b) => b.score - a.score || (a.entry.order ?? 0) - (b.entry.order ?? 0));
      cmdMatches = scored.slice(0, 14).map((s) => s.entry);
      cmdActiveIdx = 0;
      cmdStatus.textContent = `${scored.length} MATCH${scored.length === 1 ? '' : 'ES'}`;

      if (!cmdMatches.length) {
        cmdResults.innerHTML = `<div class="cmd-empty">未找到包含「${escapeHtml(q)}」的小节</div>`;
        return;
      }

      cmdMatches.forEach((item, idx) => {
        const a = document.createElement('a');
        a.className = 'cmd-item';
        a.href = `${item.topicId}.html#${encodeURIComponent(item.slug)}`;
        if (idx === 0) a.dataset.active = 'true';
        const excerpt = buildExcerpt(item.snippet, terms);
        a.innerHTML = `
          <div class="cmd-item-head">
            <span class="cmd-topic-tag">${escapeHtml(item.topicTitle)}</span>
            <span>${highlightKeyword(item.heading, terms)}</span>
          </div>
          ${excerpt ? `<div class="cmd-snippet">${highlightKeyword(excerpt, terms)}</div>` : ''}
        `;
        a.addEventListener('mouseenter', () => setCmdActive(idx));
        a.addEventListener('click', (e) => {
          if (item.topicId === TOPIC_ID) {
            e.preventDefault();
            navigateToResult(item);
          }
        });
        cmdResults.appendChild(a);
      });
    }

    function setCmdActive(idx) {
      if (!cmdMatches.length) return;
      cmdActiveIdx = (idx + cmdMatches.length) % cmdMatches.length;
      const items = cmdResults.querySelectorAll('.cmd-item');
      items.forEach((el, i) => {
        if (i === cmdActiveIdx) {
          el.dataset.active = 'true';
          el.scrollIntoView({ block: 'nearest' });
        } else {
          el.removeAttribute('data-active');
        }
      });
    }

    function openCmdPalette() {
      cmdPalette.classList.add('open');
      cmdPalette.setAttribute('aria-hidden', 'false');
      renderCmdResults(cmdInput.value);
      setTimeout(() => cmdInput.focus(), 10);
    }
    function closeCmdPalette() {
      cmdPalette.classList.remove('open');
      cmdPalette.setAttribute('aria-hidden', 'true');
    }

    document.getElementById('openCmdPalette').addEventListener('click', openCmdPalette);
    cmdPalette.addEventListener('click', (e) => { if (e.target === cmdPalette) closeCmdPalette(); });
    cmdInput.addEventListener('input', (e) => renderCmdResults(e.target.value));
    cmdInput.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        setCmdActive(cmdActiveIdx + 1);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        setCmdActive(cmdActiveIdx - 1);
      } else if (e.key === 'Enter' && cmdMatches[cmdActiveIdx]) {
        e.preventDefault();
        navigateToResult(cmdMatches[cmdActiveIdx]);
      }
    });

    // Hash deep-linking on initial page load & hashchange
    function scrollToCurrentHash() {
      if (!window.location.hash || window.location.hash.length <= 1) return;
      try {
        const slug = decodeURIComponent(window.location.hash.slice(1));
        if (slug) scrollToSlug(slug);
      } catch {}
    }
    requestAnimationFrame(() => setTimeout(scrollToCurrentHash, 60));
    window.addEventListener('hashchange', scrollToCurrentHash);

    // Global keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        if (cmdPalette.classList.contains('open')) closeCmdPalette();
        else openCmdPalette();
        return;
      }
      if (e.key === 'Escape' && cmdPalette.classList.contains('open')) {
        closeCmdPalette();
        return;
      }
      const noMod = !e.metaKey && !e.ctrlKey && !e.altKey;
      const inInput = /INPUT|TEXTAREA/.test(document.activeElement?.tagName || '');
      if (e.key === '/' && noMod && !inInput && !cmdPalette.classList.contains('open')) {
        e.preventDefault();
        searchInput.focus();
      } else if ((e.key === 'm' || e.key === 'M') && noMod && !inInput && !cmdPalette.classList.contains('open')) {
        clozeToggle.click();
      } else if (e.key === 'Escape' && document.activeElement === searchInput) {
        searchInput.value = '';
        clearSearchHighlights();
        searchInput.blur();
      }
    });
    // Keep review & star state synced on back-navigation (bfcache) and cross-tab edits
    window.addEventListener('pageshow', () => {
      syncReviewUI();
      syncStarButtons();
    });
    window.addEventListener('storage', (e) => {
      if (e.key === 'muse-grammar-reviews') syncReviewUI();
      if (e.key === 'muse-grammar-stars') syncStarButtons();
    });
  </script>
</body>
